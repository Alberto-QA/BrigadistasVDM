<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EPICA ICE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #tap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5);
      font: 600 0.85rem/1 system-ui, sans-serif;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      pointer-events: all;
      cursor: pointer;
      transition: opacity 0.6s;
      z-index: 9;
    }
    #tap.gone { opacity: 0; pointer-events: none; }
    #tour-btn {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: inline-flex; align-items: center; justify-content: center; gap: 14px;
      padding: 28px 52px; border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.28);
      color: #fff;
      font: 700 1.6rem/1 system-ui, sans-serif;
      letter-spacing: 0.1em; text-decoration: none;
      backdrop-filter: blur(12px);
      text-align: center;
      white-space: nowrap;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
    }
    #tour-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
      transform: translate(-50%, -52%);
    }
    @media (max-width: 480px) {
      #tour-btn { font-size: 1.15rem; padding: 22px 34px; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tap">Toca para activar el movimiento</div>
<a href="recorrido-virtual.html" id="tour-btn">&#9654; Recorrido 3D ICE 2026</a>

<script>
/* ── WebGL setup ─────────────────────────────────────────────── */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

const vert = `
  attribute vec2 a_pos;
  void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const frag = `
  precision highp float;
  uniform float u_time;
  uniform vec2  u_res;
  uniform vec2  u_tilt;   /* suavizado: gamma/45, beta/45 */

  /* ── Noise ──────────────────────────────────────────────── */
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(hash(i),           hash(i + vec2(1,0)), f.x),
      mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
      f.y
    );
  }
  float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 6; i++) {
      v += a * vnoise(p);
      p  = p * 2.07 + vec2(1.7, 9.2);
      a *= 0.5;
    }
    return v;
  }

  void main() {
    /* Centro normalizado */
    vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);

    float t = u_time * 0.32;

    /* El líquido "cae" hacia donde inclinas */
    vec2 pour = u_tilt * 0.45;

    /* ── Warping en 3 capas (líquido espeso) ──────────────── */
    vec2 p = uv - pour;

    vec2 q = vec2(
      fbm(p * 2.1  + vec2(0.00, t * 0.9)),
      fbm(p * 2.1  + vec2(5.20, 1.3 + t * 0.7))
    );

    vec2 r = vec2(
      fbm(p + 3.8 * q + vec2(1.70, 9.20) + t * 0.22),
      fbm(p + 3.8 * q + vec2(8.30, 2.80) + t * 0.18)
    );

    float f = fbm(p + 4.2 * r);

    /* ── Ondas de superficie reactivas al tilt ───────────── */
    float tiltLen = length(u_tilt);
    vec2  tiltDir = tiltLen > 0.01
                    ? normalize(u_tilt)
                    : vec2(1.0, 0.0);
    float ripple  = sin(dot(uv - pour, tiltDir) * 18.0 - t * 4.5)
                    * 0.035 * tiltLen;
    f += ripple;

    /* ── Reflejos tipo cáustica (zonas muy brillantes) ───── */
    float caustic = pow(max(0.0, 1.0 - abs(f - 0.52) * 8.0), 4.0);

    /* ── Luminosidad final B&W ────────────────────────────── */
    float lum = smoothstep(0.22, 0.78, f) + caustic * 0.45;
    lum = clamp(lum, 0.0, 1.0);

    gl_FragColor = vec4(vec3(lum), 1.0);
  }
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   vert));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const aPos  = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes  = gl.getUniformLocation(prog, 'u_res');
const uTilt = gl.getUniformLocation(prog, 'u_tilt');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

/* ── Tilt suavizado con inercia ──────────────────────────────── */
let tx = 0, ty = 0;        /* valor actual suavizado */
let gx = 0, gy = 0;        /* objetivo crudo         */
const LERP = 0.055;        /* más bajo = más inercia */

/* Fallback ratón / touch en desktop */
window.addEventListener('mousemove', e => {
  gx = (e.clientX / window.innerWidth  - 0.5) *  2.0;
  gy = (e.clientY / window.innerHeight - 0.5) * -2.0;
});

/* ── Giroscopio ──────────────────────────────────────────────── */
const tap = document.getElementById('tap');

function enableGyro() {
  window.addEventListener('deviceorientation', e => {
    /* gamma: inclinación izquierda/derecha  (-90..90)
       beta:  inclinación adelante/atrás     (-180..180) */
    gx =  (e.gamma || 0) / 45;
    gy = -(e.beta  || 0) / 45;
  });
  tap.classList.add('gone');
}

tap.addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    /* iOS 13+ necesita permiso explícito */
    DeviceOrientationEvent.requestPermission()
      .then(state => { if (state === 'granted') enableGyro(); })
      .catch(console.warn);
  } else {
    enableGyro();
  }
});

/* En Android el permiso no es necesario — activar automático */
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission !== 'function') {
  enableGyro();
}

/* ── Loop de render ──────────────────────────────────────────── */
function frame(ts) {
  /* Lerp para inercia de líquido */
  tx += (gx - tx) * LERP;
  ty += (gy - ty) * LERP;

  gl.uniform1f(uTime, ts * 0.001);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform2f(uTilt, tx, ty);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
