<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b0066">
  <title>Reportes</title>
  <style>
    * { margin:0; padding:0; -webkit-box-sizing:border-box; box-sizing:border-box; }
    html, body {
      min-height:100%; font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden; background:#15002b;
    }
    #bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    .container {
      position:relative; z-index:1;
      display:-webkit-box; display:-ms-flexbox; display:flex;
      -webkit-box-orient:vertical; -webkit-box-direction:normal;
      -ms-flex-direction:column; flex-direction:column;
      -webkit-box-align:center; -ms-flex-align:center; align-items:center;
      -webkit-box-pack:center; -ms-flex-pack:center; justify-content:center;
      padding:30px 16px 50px; min-height:100vh;
    }
    h1 {
      color:#fff; font-size:1.5rem; font-weight:bold; text-align:center;
      text-shadow:0 0 20px rgba(180,90,255,0.9), 0 2px 4px rgba(0,0,0,0.9);
      margin-bottom:36px; padding:14px 20px;
      background:rgba(0,0,0,0.45); border-radius:12px;
      border:1px solid rgba(180,90,255,0.45);
    }
    .btn {
      display:block; width:100%; max-width:340px;
      text-align:center; padding:18px 16px; border-radius:12px;
      text-decoration:none; font-weight:bold; font-size:1rem; color:#fff;
      margin-bottom:14px; -webkit-tap-highlight-color:transparent;
      -webkit-transition:opacity 0.15s; transition:opacity 0.15s;
    }
    .btn:active { opacity:0.75; }
    .btn-rep {
      background:rgba(74,22,124,0.95);
      border:1.5px solid rgba(190,110,255,0.9);
      text-shadow:0 0 10px rgba(190,110,255,0.7);
    }
    .btn-back {
      background:rgba(30,8,52,0.97);
      border:1.5px solid rgba(150,90,210,0.65);
      font-size:0.9rem; margin-top:8px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="container">
    <h1>Reportes</h1>

    <!-- LINK: Retiro de clientes de mapa -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSf0Q43tY0BlOa6f4nsiG4iokWHuK2mVBmLVlhBkLhvaNa77ow/viewform?usp=publish-editor"
       class="btn btn-rep" target="_blank" rel="noopener noreferrer">
      📋 Reporte de clientes que no aparecen en mapa de EPICAAPP
    </a>

    <!-- LINK: Reporte de actividades secundarias -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSffIHtonMBPPgRnUiW0WCb_N_s06U673pwgKLRKptRvDiHnqQ/viewform?usp=header"
       class="btn btn-rep" target="_blank" rel="noopener noreferrer">
      📋 Reporte de actividades secundarias
    </a>

    <!-- LINK: Reporte de clientes no evaluables -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSf9ylxxJOGwkQv5VkGICAV7F4C8A1_2wIgbTuD_LlSEAyE-eQ/viewform?usp=publish-editor"
       class="btn btn-rep" target="_blank" rel="noopener noreferrer">
      📋 Reporte de clientes no evaluables
    </a>

    <!-- LINK: Regresa a la página principal -->
    <a href="inicio.html" class="btn btn-back">← Regresar</a>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('bg');
      var gl = null;
      try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch (e) {}
      if (!gl) { canvas.style.display = 'none'; return; }

      var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';

      /*
       * Humo violeta — fbm (fractal brownian motion) sobre value noise,
       * con las coordenadas desplazándose hacia arriba en el tiempo para
       * simular humo que asciende. Domain warping añade remolinos.
       */
      var FS = [
        'precision mediump float;',
        'uniform float u_t;',
        'uniform vec2  u_r;',

        'float hash(vec2 p){',
        '  p = fract(p * vec2(123.34, 456.21));',
        '  p += dot(p, p + 45.32);',
        '  return fract(p.x * p.y);',
        '}',

        'float noise(vec2 p){',
        '  vec2 i = floor(p); vec2 f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  float a = hash(i);',
        '  float b = hash(i + vec2(1.0, 0.0));',
        '  float c = hash(i + vec2(0.0, 1.0));',
        '  float d = hash(i + vec2(1.0, 1.0));',
        '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
        '}',

        'float fbm(vec2 p){',
        '  float v = 0.0; float amp = 0.5;',
        '  for (int i = 0; i < 5; i++) {',
        '    v += amp * noise(p);',
        '    p *= 2.0; amp *= 0.5;',
        '  }',
        '  return v;',
        '}',

        'void main(){',
        '  vec2 uv = gl_FragCoord.xy / u_r;',
        '  uv.x *= u_r.x / u_r.y;',
        '  float t = u_t * 0.10;',

        /* humo ascendente: desplazamos en Y con el tiempo */
        '  vec2 q = vec2(fbm(uv * 3.0 + vec2(0.0, -t)),',
        '               fbm(uv * 3.0 + vec2(5.2, 1.3 - t)));',
        '  vec2 r = vec2(fbm(uv * 3.0 + 4.0 * q + vec2(1.7, 9.2 - t * 1.2)),',
        '               fbm(uv * 3.0 + 4.0 * q + vec2(8.3, 2.8 - t * 1.2)));',
        '  float f = fbm(uv * 3.0 + 4.0 * r);',

        '  float d = clamp(f * f * 2.2, 0.0, 1.0);',

        /* paleta violeta: negro -> violeta profundo -> violeta -> lila claro */
        '  vec3 c0 = vec3(0.04, 0.01, 0.10);',
        '  vec3 c1 = vec3(0.28, 0.08, 0.55);',
        '  vec3 c2 = vec3(0.55, 0.25, 0.85);',
        '  vec3 c3 = vec3(0.85, 0.70, 1.00);',

        '  vec3 col = mix(c0, c1, smoothstep(0.0, 0.45, d));',
        '  col = mix(col, c2, smoothstep(0.35, 0.75, d));',
        '  col = mix(col, c3, smoothstep(0.75, 1.0, d) * 0.7);',

        /* vineta suave */
        '  vec2 sc = gl_FragCoord.xy / u_r * 2.0 - 1.0;',
        '  float vig = 1.0 - clamp(length(sc) * 0.7, 0.0, 1.0);',
        '  col *= pow(vig, 1.3);',

        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n');

      function sh(t, s){ var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; }
      var p = gl.createProgram();
      gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(p); gl.useProgram(p);

      var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var a = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      var uT = gl.getUniformLocation(p, 'u_t'), uR = gl.getUniformLocation(p, 'u_r');

      function resize(){
        var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        var w = Math.min(Math.floor(window.innerWidth * dpr), 1080);
        var h = Math.min(Math.floor(window.innerHeight * dpr), 1920);
        canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); gl.uniform2f(uR, w, h);
      }
      resize(); window.addEventListener('resize', resize);

      var last = 0, fps = 1000 / 30;
      function draw(ts){
        if (ts - last >= fps) { last = ts; gl.uniform1f(uT, ts * 0.001); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
